<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Twist Chess Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-wood">

    <header>
        <div class="logo-container">
            <span class="logo-icon">♟️</span>
            <h1>TWIST CHESS</h1>
        </div>
        <p class="subtitle">The Ultimate Modern Strategy Experience</p>
    </header>

    <div class="app-container">
        <!-- Board Wrapper -->
        <div class="board-wrapper">
            <!-- Black Player Info -->
            <div class="player-info" id="player-black">
                <div class="player-details">
                    <div class="avatar">B</div>
                    <div>
                        <div id="black-name">Black Player</div>
                        <div class="captured-pieces" id="captured-black"></div>
                    </div>
                </div>
                <div class="timer" id="timer-black">10:00</div>
            </div>

            <!-- Chess Board -->
            <div class="chessboard" id="chessboard">
                <!-- Dynamically generated squares -->
                <div class="game-over-banner" id="gameOverBanner">
                    <h2 id="winnerTitle">Checkmate!</h2>
                    <p id="winnerSubtitle">White wins by checkmate.</p>
                    <button class="btn btn-primary" onclick="resetGame()">Play Again</button>
                </div>
            </div>

            <!-- White Player Info -->
            <div class="player-info active-turn" id="player-white">
                <div class="player-details">
                    <div class="avatar">W</div>
                    <div>
                        <div id="white-name">White Player</div>
                        <div class="captured-pieces" id="captured-white"></div>
                    </div>
                </div>
                <div class="timer" id="timer-white">10:00</div>
            </div>
        </div>

        <!-- Sidebar / Controls Panel -->
        <div class="sidebar">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('moves')">Moves</button>
                <button class="tab-btn" onclick="switchTab('settings')">Settings</button>
            </div>

            <!-- Moves Tab Content -->
            <div class="tab-content active" id="tab-moves">
                <div class="moves-scroll-container">
                    <table class="moves-table">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>White</th>
                                <th>Black</th>
                            </tr>
                        </thead>
                        <tbody id="movesListBody">
                        </tbody>
                    </table>
                </div>
                <div class="controls-group">
                    <button class="btn btn-secondary" onclick="undoMove()">↩ Undo</button>
                    <button class="btn btn-primary" onclick="flipBoard()">🔄 Flip</button>
                    <button class="btn btn-danger" onclick="resetGame()">New Game</button>
                </div>
            </div>

            <!-- Settings Tab Content -->
            <div class="tab-content" id="tab-settings">
                <div class="setting-item">
                    <label>Board Theme</label>
                    <select id="boardThemeSelect" onchange="changeBoardTheme(this.value)">
                        <option value="theme-wood">Classic Wood</option>
                        <option value="theme-blue">Ocean Blue</option>
                        <option value="theme-midnight">Midnight Dark</option>
                        <option value="theme-emerald">Emerald Forest</option>
                    </select>
                </div>

                <div class="setting-item">
                    <label>Piece Style</label>
                    <select id="pieceSetSelect" onchange="changePieceSet(this.value)">
                        <option value="standard">Standard Unicode Symbols</option>
                        <option value="bold">Heavy / Bold Glyphs</option>
                    </select>
                </div>

                <div class="setting-item">
                    <label>Time Control</label>
                    <select id="timeControlSelect" onchange="changeTimeControl(this.value)">
                        <option value="0">Unlimited</option>
                        <option value="180">3 Minutes (Blitz)</option>
                        <option value="300">5 Minutes (Blitz)</option>
                        <option value="600" selected>10 Minutes (Rapid)</option>
                        <option value="900">15 Minutes (Rapid)</option>
                    </select>
                </div>

                <div class="setting-item">
                    <label class="toggle-switch">
                        <span>Sound Effects</span>
                        <input type="checkbox" id="soundToggle" checked>
                    </label>
                </div>

                <div class="setting-item">
                    <label class="toggle-switch">
                        <span>Highlight Legal Moves</span>
                        <input type="checkbox" id="highlightToggle" checked>
                    </label>
                </div>
            </div>
        </div>
    </div>

    <!-- Promotion Modal -->
    <div class="modal-overlay" id="promotionModal">
        <div class="modal">
            <h3>Choose Promotion Piece</h3>
            <div class="promo-choices" id="promoChoices"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
