<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TwistChess</title>
    <link rel="stylesheet" href="style.css">
    <!-- Include Chess.js and Chessboard logic libraries if needed, or build custom -->
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header>
            <h1>TwistChess <span>♔</span></h1>
            <p id="game-status">Turn: White</p>
        </header>

        <!-- Chess Board Container -->
        <div class="board-container">
            <div id="chessboard" class="board">
                <!-- Board squares will be generated via JavaScript -->
            </div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <button id="restart-btn" class="btn">New Game</button>
            <button id="undo-btn" class="btn secondary">Undo</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
