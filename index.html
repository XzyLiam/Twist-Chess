<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TwistChess</title>
    <!-- Include Chess.js for move validation and rules -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="app-container">
        
        <!-- HOME SCREEN -->
        <div id="home-screen" class="screen">
            <div class="hero">
                <h1>TwistChess</h1>
                <p>The Ultimate Mobile Chess Experience</p>
            </div>
            <div class="menu-list">
                <button class="menu-btn primary" onclick="startGame('standard')">
                    <span>⚔️ Play Standard</span> <span>➔</span>
                </button>
                <button class="menu-btn" onclick="startGame('bot')">
                    <span>🤖 Play vs Bot (Easy)</span> <span>➔</span>
                </button>
                <button class="menu-btn" onclick="openPuzzles()">
                    <span>🧩 Daily Puzzles</span> <span>➔</span>
                </button>
                <button class="menu-btn" onclick="openSettings()">
                    <span>⚙️ Settings & Themes</span> <span>➔</span>
                </button>
            </div>
        </div>

        <!-- GAME SCREEN -->
        <div id="game-screen" class="screen hidden">
            <div class="game-header">
                <button class="back-btn" onclick="goHome()">❮ Menu</button>
                <div id="game-status" class="status-bar">White's Turn</div>
                <div style="width: 40px;"></div>
            </div>

            <div class="board-container">
                <div id="chessboard" class="chessboard"></div>
            </div>

            <div class="game-controls">
                <button class="action-btn" onclick="resetGame()">New Game</button>
                <button class="action-btn" onclick="undoMove()">Undo</button>
            </div>
        </div>

        <!-- SETTINGS SCREEN -->
        <div id="settings-screen" class="screen hidden">
            <div class="game-header">
                <button class="back-btn" onclick="goHome()">❮ Menu</button>
                <div class="status-bar">Settings</div>
                <div style="width: 40px;"></div>
            </div>

            <div style="margin-top: 20px;">
                <div class="setting-group">
                    <label>Board Theme</label>
                    <div class="theme-selector">
                        <button class="theme-opt active" onclick="setTheme('default', event)">Classic</button>
                        <button class="theme-opt" onclick="setTheme('wood', event)">Wood</button>
                        <button class="theme-opt" onclick="setTheme('blue', event)">Ocean</button>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
